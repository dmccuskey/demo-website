# The infrastructure: what stands between a visitor and the demos. Started by scripts/deploy,
# or by hand from the repository's root:
#   docker compose --env-file .env -f infrastructure/compose.yaml up -d
name: demo-infrastructure

services:
    # Routes each request by its hostname to a demo's door
    caddy:
        image: caddy:2.10-alpine
        environment:
            DEMO_DOMAIN: ${DEMO_DOMAIN:?}
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
            # Every demo's folder, for its Caddy snippet
            - ../demos:/demos:ro
        ports:
            # For this machine only: the tunnel reaches Caddy over the default network, not here
            - 127.0.0.1:${CADDY_PORT:-8080}:80
        networks:
            - default
            - demos
        restart: unless-stopped

    # The tunnel's client: connects outbound to Cloudflare, and sends every request to Caddy. Its
    # hostnames are set on the tunnel, in the Cloudflare account. Started only with the profile
    # `tunnel`, which a Mac without a tunnel leaves out
    cloudflared:
        image: cloudflare/cloudflared:2026.10.1
        profiles:
            - tunnel
        command: tunnel --no-autoupdate run
        environment:
            TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
        # Only the default network: it reaches Caddy, and no demo
        networks:
            - default
        depends_on:
            - caddy
        restart: unless-stopped

networks:
    # Shared with every demo's door, and with nothing else in a demo
    demos:
        name: demos
